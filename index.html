<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171020">
  <title>Bestie Birthday Surprise ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ambient"></div>
  <div id="particles"></div>
  <div id="confetti"></div>
  <main id="app" aria-live="polite"></main>

  <div class="chrome">
    <button id="backBtn" class="back-btn" type="button" aria-label="Go back">← Back</button>
    <div id="pageIndicator" class="page-indicator"></div>
    <button id="nextBtn" class="next-btn" type="button">NEXT <span>→</span></button>
  </div>

  <div id="toast" class="toast"></div>
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeLightbox" aria-label="Close">×</button>
    <img id="lightboxImg" alt="Memory">
  </div>

  <script src="script.js"></script>
</body>
</html>
